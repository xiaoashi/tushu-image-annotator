[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tushu"
version = "1.1.0"
description = "图枢图像批量处理与智能辅助标注软件"
requires-python = ">=3.11,<3.13"
dependencies = ["PySide6-Essentials>=6.8,<6.9", "Pillow>=11,<12", "numpy>=2.1,<3", "opencv-python-headless>=4.10,<5", "onnxruntime>=1.20,<2", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "pyinstaller>=6,<7", "ruff>=0.11,<1", "onnx>=1.17,<2", "pycocotools>=2.0.8,<3"]

[project.scripts]
tushu = "tushu.app.main:main"
tushu-web = "tushu.web.launcher:main"
tushu-check = "tushu.app.check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tushu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
